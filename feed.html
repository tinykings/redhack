<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedHack</title>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="stylesheet" href="feed.css">
</head>
<body>
  <header>
    <img class="app-icon" src="icons/icon-48.png" width="32" height="32" alt="">
    <h1>RedHack</h1>
    <span id="status"></span>
    <button id="refresh" type="button">Refresh</button>
  </header>
  <p id="keyboard-help">Hover a column: j/k navigate · Enter opens post / plays video · c opens comments (new tabs). Player focused? Click outside for j/k.</p>
  <div id="notice" hidden></div>
  <main id="feeds" aria-describedby="keyboard-help">
    <section class="feed-column" data-source="reddit" aria-labelledby="reddit-heading">
      <div class="feed-heading">
        <h2 id="reddit-heading">Reddit</h2>
        <select id="reddit-sort" aria-label="Reddit sort">
          <option value="best">Best</option>
          <option value="top">Top</option>
          <option value="new">New</option>
        </select>
        <select id="reddit-timeframe" aria-label="Reddit Top timeframe" hidden>
          <option value="hour">Past hour</option>
          <option value="day" selected>Past day</option>
          <option value="week">Past week</option>
          <option value="month">Past month</option>
          <option value="year">Past year</option>
          <option value="all">All time</option>
        </select>
      </div>
      <ol id="reddit-feed" class="post-list" aria-labelledby="reddit-heading" tabindex="0"></ol>
    </section>
    <section class="feed-column" data-source="hn" aria-labelledby="hn-heading">
      <h2 id="hn-heading">Hacker News</h2>
      <ol id="hn-feed" class="post-list" aria-labelledby="hn-heading" tabindex="0"></ol>
    </section>
    <section class="feed-column" data-source="youtube" aria-labelledby="youtube-heading">
      <h2 id="youtube-heading">YouTube</h2>
      <ol id="youtube-feed" class="post-list" aria-labelledby="youtube-heading" tabindex="0"></ol>
    </section>
  </main>
  <script type="module" src="feed.js"></script>
</body>
</html>
